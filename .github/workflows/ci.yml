name: CI

on:
  push:
    branches: [main, TITO_Guatemala]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.3"
          args: check .

      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.3"
          args: format --check .

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning tito-run.sh container-build.sh \
            docker-entrypoint.sh manage_cron.sh setup_tito.sh reset_tito.sh \
            cleanup_outputs.sh load-docker-images.sh docker-build.sh \
            docker-save-archives.sh docker-to-apptainer.sh \
            sif_convert_on_argon.sh tito_orchestrator_job.sh

  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"

      - name: Run unit tests
        run: python -m pytest -q
