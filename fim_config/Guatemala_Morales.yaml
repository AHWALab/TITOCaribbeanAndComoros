# FIM site: Guatemala, Morales (Rio Motagua). ACTIVE since v1.5.0.
# ------------------------------------------------------------------------------
# STATUS: the flood map library arrived (Morales.zip, 200 scenarios) and the
# scenario store is built and shipped: fim_store/Guatemala/
# fim_store_Morales_v1.zarr.zip (200 scenarios, max depth per scenario at
# 1 cm precision, 5 m grid, EPSG 3857). Magnitudes are REAL RainyDay storm
# totals: the mean of each scenario's 72 band rain geotiff over the Morales
# model domain footprint (column footprint_mean_mm in
# fim_store/Guatemala/magnitudes_Morales_real.csv; the box means in that
# file were reverified against the delivered geotiffs, agreement 0.02
# percent). One scenario has zero rain over the footprint (sample_0002,
# the overbank reference below) and three more sit below 5 mm.
#
# FLUVIAL: still off. The delivery contains max depth maps only, no
# boundary discharge series per scenario, so the fluvial index cannot be
# attached yet. When the per scenario Motagua inflows arrive, attach them
# with fim_dev/attach_real_magnitudes_santaines.py as the template and set
# fluvial.enabled true (the boundary gauge series below must then also be
# written by the Guatemala basin list, outputts=true).
region: Guatemala_Morales

outputs_root: outputs
cycle_format: "%Y%m%d.%H%M%S"

aoc_geojson: fim_config/aoc/Guatemala_Morales_aoc.geojson
store: fim_store/Guatemala/fim_store_Morales_v1.zarr
products_root: outputs/Guatemala/fim_Morales

member:
  template: "tmp_output_crest_scampr_{qpf}"

trigger:
  threshold: 1.0
  sources:
    - template: "tmp_output_crest_scampr_{qpf}"
    - template: "tmp_output_crest_imerg"

hazards:
  pluvial:
    enabled: true
    grid: qpe_accum
    band: [0.9, 1.2]
    band_wide: [0.8, 1.3]
  fluvial:
    enabled: false      # waiting for per scenario boundary discharges
    stat: max
    method: standardized
    boundary_series:
      - "ts.cuenca_motagua_1.crest.{cycle}.csv"
      - "ts.cuenca_motagua_2.crest.{cycle}.csv"

# USER INPUT: depth thresholds in meters.
# NOTE: in orchestrated runs the fim_regions block in
# Caribbean_Comoros_config.py OVERRIDES this thresholds list.
thresholds_m: [0.10, 0.30, 0.70, 1.00]

overbank:
  enabled: true
  # sample_0002 is the zero rain scenario of the library: its map holds the
  # permanent channel water only, which is exactly the overbank reference
  reference_scenario: sample_0002

sampling:
  expand_steps_km: [0, 2, 5, 10, 15]
  min_valid_cells: 50

likelihood_bands:
  very_low: [0.0, 0.2]
  low: [0.2, 0.4]
  medium: [0.4, 0.6]
  high: [0.6, 1.01]
