# FIM site: Guatemala, Santa Ines Petapa (cuenca Villalobos). PRODUCTION config.
# ------------------------------------------------------------------------------
# Picked up automatically by orchestrator.py Phase 3 because the filename starts
# with the region name "Guatemala" (one YAML per FIM site; Guatemala currently
# has two sites, this one and Guatemala_Morales.yaml).
# To disable this site without deleting the file, add a top-level line:
#     enabled: false
#
# This site runs BOTH hazards: pluvial (rainfall analog matching) and fluvial
# (boundary discharge analog matching), plus the combined PF product.
# Validated on the 20 to 22 June 2023 hindcast (49 cycles): fluvial High
# likelihood 6 to 9 hours before the CONRED flood reports of 21 June 2023.
#
# BEFORE FIRST USE (see README_FIM.md, "Manual steps"):
#   1. unzip the store once: python fim_store/unzip_stores.py (README_STORES.md)
#   2. make sure the Guatemala basin list writes the two boundary gauge series
#      ts.cuenca_villalobos_1 / ts.cuenca_villalobos_2 (outputts=true), otherwise
#      the fluvial routine finds no discharge input and reports it
#
# Relative paths resolve against: the root: key if given, else the TITO_FIM_ROOT
# environment variable, else the launch directory (operational runs launch from
# the repo root, so the repo-relative paths below work unchanged).
region: Guatemala_SantaInesPetapa

# Operational orchestrator tree (region output folder is outputs/<Region>).
# For HPC hindcast trees (StormLab 50 member layout) see
# fim_config/examples/Guatemala_SantaInesPetapa_HPC_stormlab.yaml.
outputs_root: outputs/Guatemala
cycle_format: "%Y%m%d.%H%M%S"

aoc_geojson: fim_config/aoc/Guatemala_SantaInesPetapa_aoc.geojson
store: fim_store/Guatemala/fim_store_SantaInesPetapa_v1.zarr
products_root: outputs/Guatemala/fim_SantaInesPetapa

# Every run folder matched by member.template counts as one ensemble member.
# Operationally Guatemala runs one QPF branch (GFS), so this matches one
# member per cycle; if more QPF branches are enabled later they are picked up
# automatically. The placeholders ({qpf}, {ens}, {sl}, ...) are free names.
member:
  template: "tmp_output_crest_scampr_{qpf}"

trigger:
  threshold: 1.0             # max unit streamflow (m3 s-1 km-2) over the AOC
  sources:
    - template: "tmp_output_crest_scampr_{qpf}"
    - template: "tmp_output_crest_imerg"

# Hazard switches. This is the block that decides what runs at this site.
# Pluvial only sites simply set fluvial enabled: false (see the template in
# fim_config/examples/PluvialOnly_country_template.yaml).
hazards:
  pluvial:
    enabled: true
    grid: qpe_accum          # rain total grid of each member (qpeaccum tif)
    band: [0.9, 1.2]         # accept scenarios within 90 to 120 percent first
    band_wide: [0.8, 1.3]    # then 80 to 130 percent, then nearest with flags
  fluvial:
    enabled: true
    stat: max                # match on the member maximum boundary discharge
    method: standardized     # z score nearest neighbor, as in the prototype
    boundary_series:
      - "ts.cuenca_villalobos_1.crest.{cycle}.csv"
      - "ts.cuenca_villalobos_2.crest.{cycle}.csv"

# USER INPUT: depth thresholds in meters, any number of values. Every value
# produces its own probability and likelihood class rasters per routine.
# NOTE: the fim_regions block in Caribbean_Comoros_config.py OVERRIDES this
# list in operational runs; edit it there. This list applies to standalone runs.
thresholds_m: [0.10, 0.30, 0.70, 1.00]

# Overbank variants mask pixels that are already wet in a near zero inflow
# reference scenario, so the maps read as hazard beyond the permanent channel.
# Use the overbank products for impact reading.
overbank:
  enabled: true
  reference_scenario: sample_0002

sampling:
  expand_steps_km: [0, 2, 5, 10, 15]
  min_valid_cells: 50

likelihood_bands:
  very_low: [0.0, 0.2]
  low: [0.2, 0.4]
  medium: [0.4, 0.6]
  high: [0.6, 1.01]
