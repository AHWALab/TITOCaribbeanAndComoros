# IBF receptor product: Haiti, Riviere Grise (Port-au-Prince plain) (paired with the FIM site
# Haiti_Gris.yaml; same stem plus _ibf). 90m FIM basin site.
#
# Static data: ibf_data/Haiti/, cut from the IBF team's IBFv1.0 v10
# package (IBF_v10_HAITI.zip) to the admin units touching the 90m FIM
# sites by fim_dev/build_ibf_preload_v10.py (see manifest_ibf_Haiti.json).
# Admin units are kept whole so the dasymetric population share and the IWF
# baselines cover each unit's full building stock, not only the FIM window.
#
# In orchestrated runs tito_hook overrides fim_products with the cycle
# first path (outputs/<cycle>/haiti_90m/fim/<chain>/Haiti_Gris/<mode>) and the
# ibf_regions block in Caribbean_Comoros_config.py OVERRIDES
# severity_thresholds_m, hazard_flag_cutoff and reporting_threshold.
region: Haiti_Gris

receptors:
  buildings:
    source: ibf_data/Haiti/haiti_overture_bld_rds.gpkg
    layer: buildings
    id_field: id
    subtype_field: subtype
  roads:
    source: ibf_data/Haiti/haiti_overture_bld_rds.gpkg
    layer: roads
    id_field: id
    class_field: class
    # IBFv1.0 v10 road classes
    keep_classes: [motorway, trunk, primary, secondary, tertiary, residential]
  places:
    source: ibf_data/Haiti/haiti_overture_bld_rds.gpkg
    layer: places
    id_field: id
    name_field: name
    category_field: category
  admin:
    source: ibf_data/Haiti/Haiti_admin_population.gpkg
    layer: admin
    id_field: ADM_ID
    name_field: ADM_NAME
    population_field: population   # WorldPop 2025 sum per GADM adm4
  land_use:
    source: ibf_data/Haiti/Haiti_GHS_BUILT_C_FUN_E2018_R2023A_54009_10.tif
  work_crs: "EPSG:32618"
  domain_buffer_m: 250
  cache_dir: outputs/ibf_cache

fim_products:
  # P+F site: the combined (pluvial max fluvial) grids, overbank flavour
  # (baseline channel water removed), as in the IBFv1.0 v10 runs
  root: outputs/{cycle}/haiti_90m/fim/stream_sat_stormlab/Haiti_Gris/{mode}
  mode: combined_overbank
  prefer_overbank: true

classification:
  reporting_threshold: 0.05
  severity_thresholds_m:
    minor: 0.10
    significant: 0.30
    severe: 0.70
  hazard_flag_cutoff: 0.50    # user default; IBFv1.0 v10 used 0.40

outputs:
  # Orchestrated runs override to outputs/<cycle>/haiti_90m/ibf/Haiti_Gris/
  root: outputs/ibf/{region}
  append_cycle: true
